<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Picker</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<header><h1><a href="../../">Web Tools</a> / Color Picker</h1></header>
<main>
<input type="color" id="p" value="#3498db">
<p>Hex: <code id="h">#3498db</code></p>
</main>
<script>
const p=document.getElementById('p');
p.addEventListener('input',()=>{document.getElementById('h').textContent=p.value;});
</script>
</body>
</html>
