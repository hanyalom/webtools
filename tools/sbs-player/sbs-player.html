<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-SBS Eye Viewer</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --line:#2c343f; --text:#e6e9ee; --dim:#8a94a3; --acc:#4da3ff; --rec:#ff4d4d; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; position:relative; }
  canvas { max-width:100%; max-height:100%; background:#000; }
  #hint { position:absolute; color:var(--dim); text-align:center; pointer-events:none; padding:0 16px; }
  #bar { background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  .grp { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  button, select, label.btn { background:#262d37; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 11px; font:inherit; cursor:pointer; }
  button:hover, label.btn:hover { border-color:var(--acc); }
  button.on { background:var(--acc); color:#06121f; border-color:var(--acc); font-weight:600; }
  button.rec { border-color:var(--rec); color:var(--rec); }
  button.rec.active { background:var(--rec); color:#fff; }
  input[type=range] { accent-color:var(--acc); }
  input[type=checkbox] { accent-color:var(--acc); }
  #seek { width:240px; max-width:60vw; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; text-align:right; max-width:100%; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--rec); margin-right:5px; animation:b 1s infinite; }
  @keyframes b { 50% { opacity:.2; } }
  small { color:var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="hint">Open a half-SBS video file (or drop it here)<br>or start a capture card.</div>
</div>

<div id="bar">
  <div class="grp">
    <label class="btn">Open file<input id="file" type="file" accept="video/*" hidden></label>
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <small id="time">0:00 / 0:00</small>
    <small>Vol</small><input id="vol" type="range" min="0" max="1" step="0.01" value="1" style="width:80px">
  </div>

  <div class="grp">
    <small>View:</small>
    <button data-mode="left" class="on">Left eye (1)</button>
    <button data-mode="right">Right eye (2)</button>
    <button data-mode="sbs">Half SBS (3)</button>
  </div>

  <div class="grp">
    <select id="dev"><option value="">Capture device…</option></select>
    <button id="refresh" title="Ask for camera permission and refresh the device list">↻ Refresh</button>
    <button id="cap">Start capture</button>
  </div>

  <div class="grp">
    <button id="recBtn" class="rec">● Record</button>
    <label title="Records a second file with the untouched half-SBS picture, at the same time"><input type="checkbox" id="both"> also record raw SBS</label>
    <button id="fs">Fullscreen</button>
  </div>
  <div id="status">Ready</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const rawCv = document.createElement('canvas'), rawCtx = rawCv.getContext('2d');
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'auto';

  let mode = 'left';            // 'left' | 'right' | 'sbs'
  let source = null;            // 'file' | 'capture'
  let capStream = null;
  let objUrl = null;
  let recs = [];                // active recordings
  let rawActive = false;

  const setStatus = s => { $('status').textContent = s; };
  const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if (!hasMedia) {
    setStatus(isSecureContext
      ? 'This browser has no camera/capture API.'
      : 'Capture needs a secure page: open this file via https:// or http://localhost (not file:// on a phone).');
  }

  /* ---------- rendering ---------- */
  function draw() {
    requestAnimationFrame(draw);
    const w = vid.videoWidth, h = vid.videoHeight;
    if (!w || !h || vid.readyState < 2) return;
    if (!recs.length && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; }
    const cw = cv.width, ch = cv.height;
    if (mode === 'sbs') ctx.drawImage(vid, 0, 0, w, h, 0, 0, cw, ch);
    else if (mode === 'left') ctx.drawImage(vid, 0, 0, w / 2, h, 0, 0, cw, ch);
    else ctx.drawImage(vid, w / 2, 0, w / 2, h, 0, 0, cw, ch);
    if (mode !== 'sbs') drawLabel(mode === 'left' ? 'LEFT EYE' : 'RIGHT EYE');
    if (rawActive) rawCtx.drawImage(vid, 0, 0, rawCv.width, rawCv.height);
    $('hint').style.display = 'none';
  }
  function drawLabel(text) {
    const s = cv.height / 1080, fs = Math.round(34 * s), pad = 14 * s, m = 24 * s;
    ctx.font = `700 ${fs}px system-ui, sans-serif`;
    const tw = ctx.measureText(text).width, bw = tw + pad * 2, bh = fs + pad;
    const x = cv.width - bw - m, y = m;
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 8 * s); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x + pad, y + bh / 2 + 1);
  }
  requestAnimationFrame(draw);

  /* ---------- mode selection ---------- */
  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName) && e.target.type !== 'range') return;
    const k = e.key.toLowerCase();
    if (k === '1' || k === 'l') setMode('left');
    else if (k === '2' || k === 'r') setMode('right');
    else if (k === '3' || k === 'o') setMode('sbs');
    else if (k === ' ' && source === 'file') { e.preventDefault(); togglePlay(); }
    else if (k === 'f') toggleFs();
  });

  /* ---------- file source ---------- */
  function stopCapture() {
    if (capStream) { capStream.getTracks().forEach(t => t.stop()); capStream = null; }
    vid.srcObject = null;
    $('cap').textContent = 'Start capture';
  }
  function loadFile(f) {
    if (!f) return;
    if (recs.length) return setStatus('Stop recording before changing the source.');
    stopCapture();
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(f);
    source = 'file';
    vid.src = objUrl;
    vid.play().catch(() => {});
    setStatus('Loaded: ' + f.name);
  }
  $('file').onchange = e => loadFile(e.target.files[0]);
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

  function togglePlay() { if (source === 'file') vid.paused ? vid.play() : vid.pause(); }
  $('play').onclick = togglePlay;
  vid.onplay = () => $('play').textContent = 'Pause';
  vid.onpause = () => $('play').textContent = 'Play';
  $('vol').oninput = e => vid.volume = +e.target.value;

  const fmt = t => { t = Math.max(0, t | 0); const h = t / 3600 | 0, m = (t % 3600) / 60 | 0, s = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
  let seeking = false;
  vid.ontimeupdate = () => {
    if (source !== 'file' || !isFinite(vid.duration)) return;
    if (!seeking) $('seek').value = vid.currentTime / vid.duration * 1000;
    $('time').textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
  };
  $('seek').oninput = e => { seeking = true; if (isFinite(vid.duration)) vid.currentTime = e.target.value / 1000 * vid.duration; };
  $('seek').onchange = () => seeking = false;

  /* ---------- capture card source ---------- */
  const errText = e => {
    const n = e && e.name;
    if (n === 'NotAllowedError') return 'permission denied (check the camera icon in the address bar)';
    if (n === 'NotReadableError') return 'device is busy — close other apps/browsers/tabs that are using it';
    if (n === 'NotFoundError') return 'no video device found';
    if (n === 'OverconstrainedError') return 'device does not support the requested mode';
    return (n ? n + ': ' : '') + (e && e.message || e);
  };

  async function listDevices() {
    if (!hasMedia) return;
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput' && d.deviceId);
      const sel = $('dev'), cur = sel.value;
      sel.innerHTML = '<option value="">Capture device…</option>' +
        devs.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Video device ' + (i + 1)}</option>`).join('');
      if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
      return devs;
    } catch (e) { setStatus('Cannot list devices: ' + errText(e)); }
  }

  $('refresh').onclick = async () => {
    if (!hasMedia) return setStatus('Capture needs https:// or http://localhost (file:// does not work on phones).');
    let tmp = null;
    try { tmp = await navigator.mediaDevices.getUserMedia({ video: true }); }
    catch (e) { setStatus('Camera permission step failed: ' + errText(e)); }
    // Chrome only reveals device ids/labels while a stream is open, so list BEFORE closing it
    const devs = await listDevices();
    if (tmp) tmp.getTracks().forEach(t => t.stop());
    if (devs) setStatus(devs.length ? `${devs.length} video device(s) found.` : 'No video devices found.');
  };
  if (hasMedia) { navigator.mediaDevices.addEventListener('devicechange', listDevices); listDevices(); }

  async function openCapture(id) {
    const tries = [
      { video: { deviceId: { exact: id }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } },
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } },
      { video: { deviceId: { exact: id }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 60 } } },
      { video: { deviceId: { exact: id } } }
    ];
    let last;
    for (const c of tries) {
      try { return await navigator.mediaDevices.getUserMedia(c); }
      catch (e) { last = e; if (e.name === 'NotAllowedError' || e.name === 'NotReadableError') break; }
    }
    throw last;
  }

  $('cap').onclick = async () => {
    if (!hasMedia) return setStatus('Capture needs https:// or http://localhost.');
    if (capStream) { if (recs.length) return setStatus('Stop recording first.'); stopCapture(); source = null; return; }
    if (recs.length) return setStatus('Stop recording before changing the source.');
    const id = $('dev').value;
    if (!id) return setStatus('Pick a capture device first (click ↻ Refresh).');
    try {
      vid.pause(); vid.removeAttribute('src');
      capStream = await openCapture(id);
      source = 'capture';
      vid.srcObject = capStream;
      await vid.play();
      const s = capStream.getVideoTracks()[0].getSettings();
      $('cap').textContent = 'Stop capture';
      $('time').textContent = 'LIVE';
      setStatus(`Capturing ${s.width}×${s.height} @ ${Math.round(s.frameRate || 0)} fps` + (capStream.getAudioTracks().length ? '' : ' (no audio)'));
    } catch (e) { capStream = null; setStatus('Capture failed: ' + errText(e)); }
  };

  /* ---------- recording (streamed to disk) ---------- */
  const mimes = ['video/mp4;codecs=avc1.640033,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const pickMime = () => window.MediaRecorder && mimes.find(m => MediaRecorder.isTypeSupported(m));

  function audioTracks() {
    if (source === 'capture' && capStream) return capStream.getAudioTracks();
    const cs = vid.captureStream ? vid.captureStream() : vid.mozCaptureStream ? vid.mozCaptureStream() : null;
    return cs ? cs.getAudioTracks() : [];
  }

  // A "sink" is where recorded chunks go: {write(blob), close()}
  const fileSink = w => ({ write: b => w.write(b), close: async () => { await w.close(); } });
  const opfsSink = (handle, w, name) => ({
    write: b => w.write(b),
    close: async () => {
      await w.close();
      const f = await handle.getFile();                       // disk-backed File, not RAM
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
  });
  const memSink = (name, mime) => { const parts = [];
    return { write: async b => { parts.push(b); }, close: async () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(parts, { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } }; };

  async function openSinks(tags, mime, ext) {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const names = tags.map(t => `sbs-${stamp}-${t}.${ext}`);
    // 1) real disk streaming (Chrome / Edge desktop)
    if (tags.length > 1 && window.showDirectoryPicker) {
      const dir = await showDirectoryPicker({ mode: 'readwrite' });
      const out = [];
      for (const n of names) out.push(fileSink(await (await dir.getFileHandle(n, { create: true })).createWritable()));
      return out;
    }
    if (tags.length === 1 && window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: names[0], types: [{ description: 'Video', accept: { [mime.split(';')[0]]: ['.' + ext] } }] });
      return [fileSink(await h.createWritable())];
    }
    // 2) browser-private disk storage (Android Chrome etc.): streamed to disk, downloaded when you stop
    if (navigator.storage && navigator.storage.getDirectory) {
      try {
        const root = await navigator.storage.getDirectory();
        const out = [];
        for (const n of names) {
          const h = await root.getFileHandle(n, { create: true });
          out.push(opfsSink(h, await h.createWritable(), n));
        }
        setStatus('This browser cannot pick a save location; recording to private storage, it downloads when you stop.');
        return out;
      } catch (e) { /* fall through */ }
    }
    // 3) RAM
    if (!confirm('This browser cannot stream recordings to disk. Recording would be kept in RAM (risky for long videos). Continue?')) throw new Error('cancelled');
    return names.map(n => memSink(n, mime));
  }

  function startOne(canvas, sink, mime, tracks) {
    const stream = canvas.captureStream(60);
    tracks.forEach(t => stream.addTrack(t));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000, audioBitsPerSecond: 192_000 });
    const r = { rec, bytes: 0, chain: Promise.resolve(), done: null };
    rec.ondataavailable = e => {
      if (!e.data.size) return;
      r.bytes += e.data.size;
      r.chain = r.chain.then(() => sink.write(e.data)).catch(err => setStatus('Disk write error: ' + err.message));
    };
    r.done = new Promise(res => rec.onstop = async () => { await r.chain; try { await sink.close(); } catch (e) { setStatus('Close error: ' + e.message); } res(); });
    rec.start(2000);          // flush to disk every 2 s
    return r;
  }

  let tick = null, t0 = 0;
  async function startRec() {
    if (!source || !vid.videoWidth) return setStatus('Load a video or start a capture first.');
    const mime = pickMime();
    if (!mime) return setStatus('MediaRecorder is not supported in this browser.');
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const both = $('both').checked;
    let sinks;
    try { sinks = await openSinks(both ? ['view', 'sbs'] : ['view'], mime, ext); }
    catch (e) { return setStatus(e.message === 'cancelled' || e.name === 'AbortError' ? 'Recording cancelled.' : 'Cannot open output: ' + e.message); }

    const tracks = audioTracks();
    recs = [startOne(cv, sinks[0], mime, tracks)];
    if (both) {
      rawCv.width = vid.videoWidth; rawCv.height = vid.videoHeight;
      rawActive = true;
      recs.push(startOne(rawCv, sinks[1], mime, tracks));
    }
    t0 = Date.now();
    $('recBtn').classList.add('active'); $('recBtn').textContent = '■ Stop recording';
    $('both').disabled = true;
    tick = setInterval(() => {
      const mb = recs.reduce((a, r) => a + r.bytes, 0) / 1048576;
      $('status').innerHTML = `<span class="dot"></span>REC ${fmt((Date.now() - t0) / 1000)} · ${mb.toFixed(0)} MB${recs.length > 1 ? ' (2 files)' : ''}`;
    }, 500);
  }
  async function stopRec() {
    if (!recs.length) return;
    const cur = recs; clearInterval(tick);
    setStatus('Finalizing…');
    cur.forEach(r => r.rec.state !== 'inactive' && r.rec.stop());
    await Promise.all(cur.map(r => r.done));
    const mb = cur.reduce((a, r) => a + r.bytes, 0) / 1048576;
    recs = []; rawActive = false;
    $('recBtn').classList.remove('active'); $('recBtn').textContent = '● Record';
    $('both').disabled = false;
    setStatus(`Saved ${cur.length} file(s), ${mb.toFixed(1)} MB total.`);
  }
  $('recBtn').onclick = () => recs.length ? stopRec() : startRec();
  addEventListener('beforeunload', e => { if (recs.length) { e.preventDefault(); e.returnValue = ''; } });
  vid.onended = () => { if (recs.length && source === 'file') stopRec(); };

  /* ---------- misc ---------- */
  function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : $('stage').requestFullscreen?.(); }
  $('fs').onclick = toggleFs;
  cv.ondblclick = toggleFs;
})();
</script>
</body>
</html>
