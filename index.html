<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web Tools</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><h1>Web Tools</h1></header>
<main>
<!-- To add a tool: create tools/<name>/ with index.html and image.svg, then add a card below. -->
<div class="grid">
  <a class="card" href="tools/word-counter/">
    <img src="tools/word-counter/image.svg" alt="Word Counter">
    <div><h2>Word Counter</h2><p>Count words and characters.</p></div>
  </a>
  <a class="card" href="tools/color-picker/">
    <img src="tools/color-picker/image.svg" alt="Color Picker">
    <div><h2>Color Picker</h2><p>Pick a color and get its hex code.</p></div>
  </a>
</div>
</main>
</body>
</html>
